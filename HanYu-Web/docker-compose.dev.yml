version: '3.9'

# ─── Local Development Stack ───────────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# Services:
#   postgres  → PostgreSQL 16 (port 5432)
#   redis     → Redis 7 (port 6379) — for future caching/session
#   minio     → S3-compatible storage (port 9000 / 9001 console)
#   mailhog   → SMTP trap + web UI (port 1025/8025)
#   seq       → Structured log viewer for Serilog (port 5341/80)
#
# All data persists in named volumes (survives compose down without --volumes).

services:
  postgres:
    image: postgres:16-alpine
    container_name: hanyu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hanyu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hanyu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  minio:
    image: minio/minio:latest
    container_name: hanyu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mailhog:
    image: mailhog/mailhog:latest
    container_name: hanyu-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025

  seq:
    image: datalust/seq:latest
    container_name: hanyu-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:5341"   # Ingestion
      - "8026:80"     # Web UI → http://localhost:8026

volumes:
  postgres_data:
  redis_data:
  minio_data:
