name: HanYu CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch (save CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  IMAGE_NAME: hanyu-api
  # Set in GitHub Secrets:
  # DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (or use GHCR)
  # NEON_DB_URL (integration test connection string)
  # PRODUCTION_SSH_HOST, PRODUCTION_SSH_USER, PRODUCTION_SSH_KEY (for deploy)

jobs:
  # ─── Job 1: Build & Unit Tests ───────────────────────────────────────────────
  build-and-unit-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore HanYu-Web/HanYu/HanYu.csproj

      - name: Build (Release)
        run: |
          dotnet build HanYu-Web/HanYu/HanYu.csproj \
            --no-restore \
            --configuration Release

      - name: Run unit tests
        run: |
          dotnet test HanYu-Web/Tests/HanYu.UnitTests/HanYu.UnitTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=unit-test-results.trx" \
            --results-directory ./test-results

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ./test-results/*.trx
          retention-days: 7

  # ─── Job 2: Integration Tests (Requires PostgreSQL) ──────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-unit-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hanyu_test
          POSTGRES_PASSWORD: hanyu_test_secret
          POSTGRES_DB: hanyu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Override connection string for integration tests
      ConnectionStrings__DefaultConnection: >-
        Host=localhost;Port=5432;Database=hanyu_test;
        Username=hanyu_test;Password=hanyu_test_secret;
        Pooling=true;Minimum Pool Size=1;Maximum Pool Size=5
      # Provide dummy JWT key for test container
      Jwt__SecretKey: ci-test-secret-key-must-be-at-least-32-bytes-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore HanYu-Web/

      - name: Build (Release)
        run: dotnet build HanYu-Web/ --no-restore --configuration Release

      - name: Apply DB migrations
        working-directory: HanYu-Web/HanYu
        run: |
          dotnet tool restore
          dotnet ef database update \
            --project HanYu.csproj \
            --no-build \
            --connection "Host=localhost;Port=5432;Database=hanyu_test;Username=hanyu_test;Password=hanyu_test_secret"

      - name: Run integration tests
        run: |
          dotnet test HanYu-Web/Tests/HanYu.IntegrationTests/HanYu.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=integration-test-results.trx" \
            --results-directory ./test-results \
            --timeout 300

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ./test-results/*.trx
          retention-days: 7

  # ─── Job 3: Docker Build & Push (only on main) ───────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-and-unit-test, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write   # For GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./HanYu-Web
          file: ./HanYu-Web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 4: Smoke Test (after Docker push) ───────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull and start Docker image
        run: |
          docker run -d \
            --name hanyu-smoke \
            -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ConnectionStrings__DefaultConnection="Host=host.docker.internal;Database=hanyu_smoke;Username=smoke;Password=smoke" \
            -e Jwt__SecretKey="smoke-test-secret-key-32-bytes-minimum-here" \
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest || true
          # Give the container 10 seconds to start
          sleep 10

      - name: Smoke test - /health/live
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health/live || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Health check failed with status $STATUS (may be expected if DB not connected)"
          fi

      - name: Cleanup smoke container
        if: always()
        run: docker rm -f hanyu-smoke || true
