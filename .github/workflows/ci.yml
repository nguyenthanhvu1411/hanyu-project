name: HanYu CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "22"

jobs:
  admin-web:
    name: Admin Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  backend-unit:
    name: Backend Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore HanYu-Web/HanYu-Web.sln

      - name: Build solution
        run: dotnet build HanYu-Web/HanYu-Web.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test HanYu-Web/Tests/HanYu.UnitTests/HanYu.UnitTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-test-results.trx"
          --results-directory "${{ github.workspace }}/test-results/unit"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/unit/*.trx
          if-no-files-found: warn
          retention-days: 7

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend-unit

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hanyu_test
          POSTGRES_PASSWORD: hanyu_test_secret
          POSTGRES_DB: hanyu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hanyu_test -d hanyu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=hanyu_test;Username=hanyu_test;Password=hanyu_test_secret;Pooling=true;Minimum Pool Size=1;Maximum Pool Size=5
      ConnectionStrings__MigrationConnection: Host=localhost;Port=5432;Database=hanyu_test;Username=hanyu_test;Password=hanyu_test_secret
      Jwt__SecretKey: ci-test-secret-key-must-be-at-least-32-bytes-long
      ASPNETCORE_ENVIRONMENT: Development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore HanYu-Web/HanYu-Web.sln

      - name: Build solution
        run: dotnet build HanYu-Web/HanYu-Web.sln --configuration Release --no-restore

      - name: Restore local dotnet tools
        working-directory: HanYu-Web/HanYu
        run: dotnet tool restore

      - name: Apply migrations
        working-directory: HanYu-Web/HanYu
        run: >-
          dotnet ef database update
          --project HanYu.csproj
          --connection "Host=localhost;Port=5432;Database=hanyu_test;Username=hanyu_test;Password=hanyu_test_secret"

      - name: Run integration tests
        run: >-
          dotnet test HanYu-Web/Tests/HanYu.IntegrationTests/HanYu.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration-test-results.trx"
          --results-directory "${{ github.workspace }}/test-results/integration"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/integration/*.trx
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs: [backend-integration, admin-web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./HanYu-Web
          file: ./HanYu-Web/Dockerfile
          push: false
          tags: hanyu-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
