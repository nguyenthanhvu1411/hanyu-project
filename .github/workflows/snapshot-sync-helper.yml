name: Snapshot Sync Helper

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  snapshot:
    if: github.head_ref == 'agent/lesson-integration-admin-web'
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=hanyu_snapshot;Username=hanyu;Password=hanyu
      Jwt__SecretKey: snapshot-helper-secret-key-at-least-32-bytes-long
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore HanYu-Web/HanYu-Web.sln

      - name: Restore local tools
        working-directory: HanYu-Web/HanYu
        run: dotnet tool restore

      - name: Generate synchronized snapshot
        working-directory: HanYu-Web/HanYu
        run: >-
          dotnet ef migrations add __SnapshotSyncProbe
          --project HanYu.csproj
          --output-dir Migrations/__SnapshotSyncProbe

      - name: Commit snapshot only
        shell: bash
        run: |
          git add HanYu-Web/HanYu/Migrations/HanYuDbContextModelSnapshot.cs
          if git diff --cached --quiet; then
            echo "Snapshot already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(db): synchronize EF model snapshot"
          git push origin HEAD:${{ github.head_ref }}
